# ПРИМЕР. /etc/sysctl.d/90-workstation.conf
# SysRq: 16 sync + 32 remount read-only + 128 reboot = 176 (битовая маска, docs.kernel.org/admin-guide/sysrq.html)
kernel.sysrq = 176
# Предупреждение о задачах в D-state дольше 120 секунд (нужно ядро с CONFIG_DETECT_HUNG_TASK, проверить)
kernel.hung_task_timeout_secs = 120
