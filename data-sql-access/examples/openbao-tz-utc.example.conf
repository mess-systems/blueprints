# Blueprint data-sql-access: EXAMPLE, not a running configuration.
# OpenBao renders the username_template function `timestamp` in the local
# zone of its process; audit entries are always UTC. Run the process in UTC
# so that <ts> in v_<auth>_<identity>_<role>_<ts>_<rand6> is UTC.
#
# Option 1: systemd drop-in on dc1-shared-iam-openbao-prd-01
#   /etc/systemd/system/openbao.service.d/10-tz-utc.conf
#   then: systemctl daemon-reload && systemctl restart openbao
[Service]
Environment=TZ=UTC

# Option 2: container. Set the same variable in the environment of the
# OpenBao container, for example in a compose file:
#
#   services:
#     openbao:
#       environment:
#         TZ: "UTC"
#
# Check after every change of the host or image:
#   systemctl show openbao -p Environment      # contains TZ=UTC
#   bao read database-shared/creds/eng_sdlc_git_ro
#   compare <ts> in the issued username with the "time" field of the audit
#   entry for that request; the difference is seconds, not hours.
