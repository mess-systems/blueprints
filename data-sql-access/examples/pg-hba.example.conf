# Blueprint data-sql-access: EXAMPLE, not a running configuration.
# pg_hba.conf of sql.data.shared.svc.mess.systems. TLS only; rules by role and
# source. Addresses are RFC 5737 documentation ranges; the mesh range is the
# NetBird default 100.64.0.0/10.
#
# TYPE      DATABASE          USER                     ADDRESS           METHOD

# Plain TCP is refused for everyone.
hostnossl   all               all                      0.0.0.0/0         reject
hostnossl   all               all                      ::/0              reject

# Local administration on the host: peer authentication only.
local       all               postgres                                   peer
local       all               breakglass_sql                             scram-sha-256

# OpenBao: own mesh peer, so the source is the peer address, not a router.
hostssl     eng_sdlc_git_prd  svc_shared_iam_openbao   100.64.0.0/10     scram-sha-256

# People: temporary users are members of the group roles (+ prefix).
hostssl     eng_sdlc_git_prd  +eng_sdlc_git_ro         100.64.0.0/10     scram-sha-256

# Site collector over the LAN (also allowed in the host table).
hostssl     postgres          svc_shared_obs_prometheus 192.0.2.10/32     scram-sha-256

# Everything else.
host        all               all                      0.0.0.0/0         reject
host        all               all                      ::/0              reject
