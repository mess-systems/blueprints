# Blueprint data-sql-access: EXAMPLE, not a running configuration.
# postgresql.conf fragment: TLS and the first link of the attribution chain.
# Log time is UTC so that it lines up with the OpenBao audit log.

# TLS: server certificate from pki-int/issue/data-shared,
# SAN sql.data.shared.svc.mess.systems only.
ssl = on
ssl_cert_file = '/etc/postgresql/tls/sql.data.shared.svc.mess.systems.crt'
ssl_key_file  = '/etc/postgresql/tls/sql.data.shared.svc.mess.systems.key'
ssl_min_protocol_version = 'TLSv1.2'
password_encryption = 'scram-sha-256'

# Who connected, from where, for how long.
log_connections    = on
log_disconnections = on

# What changed. Use pgaudit for object-level audit:
#   shared_preload_libraries = 'pgaudit'
#   pgaudit.log = 'ddl, role'
log_statement = 'ddl'

# Time (with zone), user, database, client address, session ID.
log_timezone    = 'UTC'
log_line_prefix = '%m [%p] %u@%d %r %c '

# Ship to Loki (service_name = shared-data-postgres) and Wazuh through the
# local collector; stderr to the journal is enough.
log_destination = 'stderr'
