# EXAMPLE ONLY. Placeholder values; not the configuration of any running system.
# ~/.config/containers/containers.conf for rootless Podman on eng devices.
# No daemon: containers start on demand, so Podman is not a resident agent.
[containers]
userns = "keep-id"
log_driver = "journald"

[engine]
cgroup_manager = "systemd"
events_logger = "journald"
