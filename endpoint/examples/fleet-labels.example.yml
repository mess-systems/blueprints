# EXAMPLE ONLY. Placeholder values; not the configuration of any running system.
# Fleet labels that group devices by endpoint profile, derived from the device name
# <profile>-<form>-<asset-id>. Apply with fleetctl apply -f <file>.
---
apiVersion: v1
kind: label
spec:
  name: endpoint-profile-std
  description: Devices on the std baseline
  query: SELECT 1 FROM system_info WHERE computer_name LIKE 'std-%';
  label_membership_type: dynamic
