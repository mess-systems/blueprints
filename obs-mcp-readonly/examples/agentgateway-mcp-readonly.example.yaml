# yaml-language-server: $schema=https://agentgateway.dev/schema/config
# Blueprint obs-mcp-readonly: EXAMPLE, not a running configuration.
# Fictional hosts under mess.systems. Field names follow the agentgateway
# standalone docs and config schema (mcp-authn, mcp-authz, backend-authn token
# exchange, access logs; agentgateway v1.7.0). Tool names follow the server
# READMEs; check them against tools/list of the server versions you run.
# Targets are named by capability code (naming standard, object forms).
#
# Token exchange below is the fallback path of README section 4.3 (Keycloak
# standard token exchange): the incoming token is never forwarded, each target
# gets a token whose audience is only its MCP server. With the delegation path
# (section 4.2) Keycloak rejects a second exchange of a token that carries
# `act`; remove backendAuth there and authenticate the gateway to the MCP
# servers with its own credential.

mcp:
  policies:
    mcpAuthentication:
      mode: strict
      issuer: https://sso.iam.shared.svc.mess.systems/realms/mess-systems
      audiences:
      - https://gateway.ai.corp.svc.mess.systems/mcp
      jwks:
        url: https://sso.iam.shared.svc.mess.systems/realms/mess-systems/protocol/openid-connect/certs
      provider:
        keycloak: {}
      resourceMetadata:
        resource: https://gateway.ai.corp.svc.mess.systems/mcp
        scopesSupported:
        - openid
        bearerMethodsSupported:
        - header
    mcpAuthorization:
      rules:
      # Kubernetes: read tools only
      - 'mcp.tool.target == "k8s" && mcp.tool.name in ["resources_list", "resources_get", "events_list", "pods_list", "pods_list_in_namespace", "pods_get", "pods_log", "namespaces_list"]'
      # Grafana datasources: Prometheus and Loki queries only
      - 'mcp.tool.target == "dashboards" && mcp.tool.name in ["query_prometheus", "list_prometheus_metric_names", "query_loki_logs", "list_loki_label_names", "list_loki_label_values"]'
  targets:
  - name: k8s
    mcp:
      host: http://mcp-k8s.gateway.svc.cluster.local:8080/mcp
    policies:
      backendAuth:
        oauthTokenExchange:
          host: sso.iam.shared.svc.mess.systems:443
          path: /realms/mess-systems/protocol/openid-connect/token
          policies:
            backendTLS: {}
          clientAuth:
            method: privateKeyJwt
            clientId: svc-corp-ai-agentgateway
            signingKey:
              file: /etc/agentgateway/keys/token-exchange.pem
            alg: ES256
            assertionAudience: https://sso.iam.shared.svc.mess.systems/realms/mess-systems/protocol/openid-connect/token
          # Keycloak does not support the RFC 8707 resource parameter; use audience.
          # Audience = Keycloak client of the MCP server (illustrative, IdP
          # application form). The gateway client is a service account.
          audiences:
          - corp-infra-kubernetes-mcp-server
  - name: dashboards
    mcp:
      host: http://mcp-dashboards.gateway.svc.cluster.local:8080/mcp
    policies:
      backendAuth:
        oauthTokenExchange:
          host: sso.iam.shared.svc.mess.systems:443
          path: /realms/mess-systems/protocol/openid-connect/token
          policies:
            backendTLS: {}
          clientAuth:
            method: privateKeyJwt
            clientId: svc-corp-ai-agentgateway
            signingKey:
              file: /etc/agentgateway/keys/token-exchange.pem
            alg: ES256
            assertionAudience: https://sso.iam.shared.svc.mess.systems/realms/mess-systems/protocol/openid-connect/token
          # Keycloak does not support the RFC 8707 resource parameter; use audience.
          audiences:
          - corp-obs-mcp-grafana

# Audit fields (README section 6). jwt holds the claims of the token validated
# by mcpAuthentication. A delegated token carries act and no sid; a token from
# the fallback path carries azp and sid. request.agent.session comes from client
# headers such as x-session-id and is not authenticated.
frontendPolicies:
  accessLog:
    add:
      user.id: 'has(jwt.sub) ? jwt.sub : ""'
      agent.client_id: 'has(jwt.act) && has(jwt.act.client_id) ? jwt.act.client_id : (has(jwt.azp) ? jwt.azp : "")'
      auth.session_id: 'has(jwt.sid) ? jwt.sid : ""'
      agent.session: 'has(request.agent.session) ? request.agent.session : ""'
      # Result hash: requirement, not configured here. See README section 6.
